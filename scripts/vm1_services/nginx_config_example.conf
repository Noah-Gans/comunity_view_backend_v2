# Nginx Configuration for ComunityView Backend APIs
# Place this in /etc/nginx/sites-available/comunityview and symlink to sites-enabled

# Upstream servers for Property API (load balanced - 3 instances)
upstream property_api {
    least_conn;  # Use least connections load balancing
    server localhost:9011;
    server localhost:9012;
    server localhost:9013;
}

# Upstream servers for Report API (load balanced - 3 instances)
upstream report_api {
    least_conn;  # Use least connections load balancing
    server localhost:9021;
    server localhost:9022;
    server localhost:9023;
}

# Property API endpoint
server {
    listen 80;
    server_name api.yourdomain.com;  # Change to your domain or IP

    # Property API (load balanced)
    location /api/property/ {
        proxy_pass http://property_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts for long-running requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Report API (load balanced)
    location /api/report/ {
        proxy_pass http://report_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts for batch requests
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Search API (single instance on 9001)
    location /api/search/ {
        proxy_pass http://localhost:9001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Martin Tile Server (port 9000)
    location /tiles/ {
        proxy_pass http://localhost:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

